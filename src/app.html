<title>Aura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Night light: dark-first warm brown with amber, a matching warm-cream day mode. One soft column, Today first, sick mode as a banner. */
:root {
  --bg: #1F1A17; --card: #2B2420; --card-2: #342B26; --ink: #F2E6D9; --muted: #AE9F92; --line: #3A322C;
  --accent: #E3A56E; --accent-on: #2A1E15; --accent-soft: #4A3626; --accent-ink: #F2C79D;
  --warm-soft: #4A3028; --alert: #FF9C80; --ok: #9BD3A8; --wait: #F0C877;
  --c-feed: #5A4330; --c-sleep: #36394F; --c-diaper: #4A4630; --c-solids: #553A33; --c-temp: #5C3A30; --c-med: #45374F;
  --c-symptom: #523543; --c-vomit: #3E4A33; --c-doctor: #33434D; --c-photo: #3D3A36; --c-note: #3B4438; --c-say: #4A3626; --c-sound: #3A4550;
  --line-temp: #FF9C80; --mark-1: #C9B2F2; --mark-2: #8FC9E8; --mark-3: #F2A7C6; --mark-4: #E8C47A; --growth: #9BD3A8;
  --f-head: "Lora", Georgia, serif; --f-body: "Nunito", "Segoe UI", system-ui, sans-serif;
  --r: 18px;
  color-scheme: dark;
}
:root[data-mode="day"] {
  --bg: #F7F0E8; --card: #FFF9F2; --card-2: #F1E7DB; --ink: #3A2C22; --muted: #85715F; --line: #E8DCCD;
  --accent: #B8692B; --accent-on: #FFF8F0; --accent-soft: #F5DFC7; --accent-ink: #8A4A18;
  --warm-soft: #F4D9CD; --alert: #B5452C; --ok: #2F7A4C; --wait: #9A6406;
  --c-feed: #F4DDC0; --c-sleep: #DCE0EE; --c-diaper: #ECE5C6; --c-solids: #F1D5C9; --c-temp: #F5CDBE; --c-med: #E5DCF2;
  --c-symptom: #F2D6E1; --c-vomit: #DDE8CF; --c-doctor: #D8E5EC; --c-photo: #E7E1DA; --c-note: #DCE6D6; --c-say: #F5DFC7; --c-sound: #D9E3EA;
  --line-temp: #C0502F; --mark-1: #7656B8; --mark-2: #2A7FA8; --mark-3: #B04479; --mark-4: #A0711A; --growth: #2F7A4C;
  color-scheme: light;
}
* { box-sizing: border-box }
html, body { background: var(--bg); color: var(--ink) }
body { font-family: var(--f-body); font-size: 16px; line-height: 1.45; transition: background .4s }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px }
h1, h2, h3 { font-family: var(--f-head); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -0.005em }
h1 { font-size: 1.6rem; line-height: 1.15 } h2 { font-size: 1.25rem } h3 { font-size: 1.04rem }
.num { font-variant-numeric: tabular-nums }
.muted { color: var(--muted) } .small { font-size: .86rem }
input, select, textarea { background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; width: 100%; min-width: 0 }
textarea { resize: vertical }

.wrap { max-width: 600px; margin: 0 auto; padding-inline: 16px; padding-block: 0 150px }
/* "Say it" floats above the tab bar on Today and Growth: the one place to log anything by talking or typing */
.fab { position: fixed; z-index: 5; right: max(16px, calc(50% - 284px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 8px;
  border: 0; border-radius: 999px; padding: 14px 22px 14px 18px; background: var(--accent); color: var(--accent-on); font: inherit; font-weight: 800; font-size: 1.05rem; box-shadow: 0 6px 20px rgba(0,0,0,.35) }
.fab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round }
.view { display: flex; flex-direction: column; gap: 16px; padding-top: 14px }
.card { background: var(--card); border-radius: var(--r); padding: 14px 16px }
.btn { border: 0; background: var(--card-2); border-radius: 999px; padding: 10px 18px; font-weight: 700 }
.btn.primary { background: var(--accent); color: var(--accent-on) }
.btn.ghost { background: transparent; padding-inline: 10px }
.btn.danger { color: var(--alert) }
.btn.sm { padding: 6px 12px; font-size: .86rem }
.btn:disabled { opacity: .5 }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.between { justify-content: space-between }

/* Header */
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding-top: 18px }
.head .hi { font-size: .84rem; color: var(--muted) }
.avatar { width: 46px; height: 46px; border-radius: 50%; border: 0; background: var(--accent-soft); color: var(--accent-ink); font-weight: 800; font-size: 1.1rem; flex: none }
.sync { font-size: .74rem; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; border: 0; background: none; padding: 0; white-space: nowrap }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted) }
.sync.ok::before { background: var(--ok) } .sync.err::before { background: var(--alert) }

.banner { background: var(--card-2); border-radius: var(--r); padding: 12px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: .92rem }
.banner p { margin: 0; flex: 1 1 220px }
.sick { width: 100%; text-align: left; border: 0; background: var(--warm-soft); border-radius: var(--r); padding: 12px 14px; display: flex; justify-content: space-between; gap: 10px; align-items: center }
.sick .pill { background: var(--card); border-radius: 999px; padding: 4px 12px; font-size: .8rem; font-weight: 700; white-space: nowrap }
.sick-card { background: var(--warm-soft); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 8px }
.btn.end { background: var(--card); box-shadow: inset 0 0 0 1.5px var(--accent) }
.sick small { display: block; color: var(--muted); font-size: .82rem }
.backup-due { box-shadow: inset 0 0 0 1.5px var(--wait) }
.recall-due { box-shadow: inset 0 0 0 1.5px var(--alert) }
a.btn { color: inherit; text-decoration: none; display: inline-block }
.recall-row { display: flex; flex-direction: column; gap: 2px; padding: 8px 0; border-top: 1px solid var(--line); overflow-wrap: anywhere }
.recall-row:first-of-type { border-top: 0 }
.recall-row a { color: var(--accent-ink); font-size: .86rem; align-self: flex-start }
.recall-row .hit { color: var(--alert); font-weight: 700 }
.recall-row .new { color: var(--accent-ink); font-weight: 700; font-size: .78rem; text-transform: uppercase; letter-spacing: .04em }
.recall-line { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .86rem; font-weight: 600 }
.recall-line::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none }
.alerts { border-radius: var(--r); padding: 12px 14px; background: var(--card); box-shadow: inset 0 0 0 1.5px var(--wait) }
.alerts h3 { color: var(--wait); font-size: .98rem }
.alerts ul { margin: 6px 0 0; padding-left: 20px } .alerts li { margin: 3px 0 }

.sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
.tile { background: var(--card); border-radius: 16px; padding: 10px 12px; min-width: 0 }
.tile small { display: block; font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted) }
.tile strong { display: block; font-size: 1.12rem; font-weight: 800; margin-top: 2px }
.tile em { font-style: normal; font-size: .76rem; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.tile.hot strong { color: var(--alert) }
.sum.two, .sum.n2, .sum.n4 { grid-template-columns: repeat(2, minmax(0, 1fr)) } .sum.n1 { grid-template-columns: 1fr }
.track-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line) }
.track-row:first-of-type { border-top: 0 }
.track-row small { display: block; color: var(--muted); font-size: .82rem }
.tog { width: 52px; height: 30px; border-radius: 999px; border: 0; background: var(--line); position: relative; flex: none; padding: 0 }
.tog::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: var(--muted); transition: transform .2s, background .2s }
.tog[aria-checked="true"] { background: var(--accent-soft) }
.tog[aria-checked="true"]::after { transform: translateX(22px); background: var(--accent) }
.wide-tile { grid-column: 1 / -1 }
.dose-line { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); font-size: .92rem }
.dose-line:first-of-type { border-top: 0 }
.pill { font-size: .78rem; padding: 2px 9px; border-radius: 999px; background: var(--card-2); white-space: nowrap; align-self: center }
.pill.ok { color: var(--ok) } .pill.wait { color: var(--wait) }

.timer { background: var(--accent); color: var(--accent-on); border-radius: var(--r); padding: 12px 12px 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px }
.timer strong { font-size: 1.3rem; font-weight: 800 }
.timer .btn { background: var(--accent-on); color: var(--accent); padding: 8px 14px }

.quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }
.qb { border: 0; background: var(--card); border-radius: 18px; padding: 12px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: .82rem; font-weight: 700 }
.qb:active { transform: scale(.97) }
.ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: var(--c); flex: none }
.ic svg { width: 19px; height: 19px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.linkish { background: none; border: 0; color: var(--accent-ink); font-weight: 700; padding: 6px 0; text-align: left }

/* Timeline */
.day-h { display: flex; align-items: baseline; gap: 10px; padding: 10px 0 4px }
.tl { list-style: none; margin: 0; padding: 0 }
.tl li button { width: 100%; text-align: left; display: grid; grid-template-columns: auto 28px minmax(0, 1fr); gap: 10px; align-items: start; padding: 9px 0; background: none; border: 0; border-bottom: 1px solid var(--line) }
.tl .time { font-size: .84rem; color: var(--muted); padding-top: 4px; white-space: nowrap; min-width: 42px }
.tl .ic { width: 28px; height: 28px } .tl .ic svg { width: 15px; height: 15px }
.tl .what { min-width: 0; padding-top: 3px }
.tl .what .n { display: block; color: var(--muted); font-size: .88rem; overflow-wrap: anywhere; white-space: pre-wrap }
.tl .what .d { display: block; font-size: .9rem; overflow-wrap: anywhere }
.tl img { display: block; margin-top: 6px; max-width: 160px; border-radius: 10px }
.empty { text-align: center; padding: 26px 16px; display: flex; flex-direction: column; gap: 12px; align-items: center }

.t-feed { --c: var(--c-feed) } .t-sleep { --c: var(--c-sleep) } .t-diaper { --c: var(--c-diaper) } .t-solids, .t-food { --c: var(--c-solids) }
.t-temp { --c: var(--c-temp) } .t-med { --c: var(--c-med) } .t-symptom { --c: var(--c-symptom) } .t-vomit { --c: var(--c-vomit) }
.t-doctor { --c: var(--c-doctor) } .t-photo { --c: var(--c-photo) } .t-note { --c: var(--c-note) } .t-say { --c: var(--c-say) }
.t-drink { --c: var(--c-feed) } .t-sound { --c: var(--c-sound) }
.tl .by { color: var(--muted); font-size: .84rem }
.tl li:has(.media) > button { border-bottom: 0 }
.media { display: flex; flex-direction: column; gap: 6px; padding: 0 0 10px 80px; border-bottom: 1px solid var(--line); margin-top: -1px }
.media audio { width: 100%; max-width: 320px; height: 40px }
.media a { color: var(--accent-ink); font-weight: 700; font-size: .9rem }
.rec-item { padding: 10px 0 0; border-top: 1px solid var(--line); margin-top: 10px } .rec-item .media { padding: 6px 0 0; border: 0 }
.rec { display: flex; gap: 12px; align-items: center; flex-wrap: wrap }
.rec .btn.on { background: var(--alert); color: var(--bg) }
#recOut audio { width: 100% }

/* Segmented */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--card); border-radius: 999px; padding: 4px; gap: 4px }
.seg button { border: 0; background: none; border-radius: 999px; padding: 8px 6px; font-weight: 700; font-size: .88rem; color: var(--muted) }
.seg button.on { background: var(--accent-soft); color: var(--ink) }

/* Chart + tables */
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .84rem; color: var(--muted) }
.legend span { display: inline-flex; gap: 6px; align-items: center }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; background: var(--c) }
.facts { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px }
.tbl-wrap { overflow-x: auto; background: var(--card); border-radius: var(--r) }
table { border-collapse: collapse; width: 100%; font-size: .88rem; min-width: 540px }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top }
th { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700 }
tr:last-child td { border-bottom: 0 }
.r { text-align: right } td.hot { color: var(--alert); font-weight: 700 }
.narrative { white-space: pre-wrap; line-height: 1.55; overflow-wrap: anywhere }
.disclaimer { font-size: .84rem; color: var(--muted) }
.doc-said .item { border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; margin-top: 10px }

/* More */
.set { display: flex; flex-direction: column; gap: 10px }
.field { display: flex; flex-direction: column; gap: 5px }
.field > span { font-size: .82rem; font-weight: 700; color: var(--muted) }
.list-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line) }
.list-row:first-of-type { border-top: 0 }
.medrow input { width: 70px }
.grow-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px }

/* Teeth and milestones */
.mouth { display: flex; flex-direction: column; gap: 10px; align-items: center; padding: 6px 0 }
.jaw { display: flex; gap: 4px; justify-content: center }
.jaw .tooth { width: 26px; height: 32px; border-radius: 12px 12px 8px 8px; border: 1.5px solid var(--line); background: var(--card-2); padding: 0 }
.jaw.lower .tooth { border-radius: 8px 8px 12px 12px }
.jaw .tooth.m { width: 30px }
.jaw .tooth.in { background: var(--accent); border-color: var(--accent) }
.jaw .gap { width: 8px }
.jaw-label { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em }
.ms-row { width: 100%; text-align: left; display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 9px 0; background: none; border: 0; border-top: 1px solid var(--line) }
.ms-row:first-of-type { border-top: 0 }
.ms-dot { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--muted) }
.ms-row.done .ms-dot { background: var(--accent); border-color: var(--accent) }
.ms-row small { display: block; color: var(--muted); font-size: .84rem; overflow-wrap: anywhere }

/* Tabs */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); padding-bottom: env(safe-area-inset-bottom, 0px) }
.tabs .in { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr) }
.tabs button { background: none; border: 0; padding: 8px 4px 14px; font-size: .8rem; font-weight: 800; color: var(--muted) }
.tabs button::before { content: ""; display: block; width: 24px; height: 4px; border-radius: 4px; margin: 0 auto 6px; background: transparent }
.tabs button[aria-selected="true"] { color: var(--ink) }
.tabs button[aria-selected="true"]::before { background: var(--accent) }

/* Sheet */
.scrim { position: fixed; inset: 0; background: rgb(10 6 4 / .55); z-index: 20; display: flex; align-items: flex-end; justify-content: center }
.scrim[hidden] { display: none }
.sheet { background: var(--card); width: 100%; max-width: 600px; max-height: 92%; overflow-y: auto; border-radius: 26px 26px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px }
.sheet .hd { display: flex; justify-content: space-between; align-items: center; gap: 10px }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chips button { border: 0; background: var(--card-2); border-radius: 999px; padding: 9px 14px; font-size: .92rem }
.chips button.on { background: var(--accent); color: var(--accent-on); font-weight: 800 }
.chips input { width: 96px; border-radius: 999px; padding: 8px 12px }
.temp-in { display: flex; align-items: center; gap: 10px }
.temp-in button { width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--card-2); font-size: 1.5rem; font-weight: 800 }
.temp-in input { flex: 1; text-align: center; font-size: 2.1rem; font-weight: 800; padding: 6px }
.sheet-actions { display: flex; gap: 8px; justify-content: space-between; flex-wrap: wrap }
.pick { width: 100%; text-align: left; padding: 12px 14px; border: 0; border-radius: 14px; background: var(--card-2) }
.pick.on { box-shadow: inset 0 0 0 2px var(--accent) }
.parsed { display: flex; flex-direction: column; gap: 6px }
.parsed label { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 12px; background: var(--card-2) }
.parsed input { width: auto }
.dict { position: relative; display: block }
.dict textarea { padding-right: 52px }
.mic { position: absolute; right: 6px; bottom: 8px; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--card); display: grid; place-items: center; padding: 0 }
.mic svg { width: 20px; height: 20px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.mic.on { background: var(--alert) } .mic.on svg { stroke: var(--bg) }
.sent { white-space: pre-wrap; font-size: .8rem; background: var(--card-2); border-radius: 12px; padding: 10px; overflow-wrap: anywhere; max-height: 50vh; overflow-y: auto; margin: 0 }
[hidden] { display: none !important }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: .92rem; z-index: 30; max-width: calc(100% - 32px) }
@media (prefers-reduced-motion: reduce) { .qb:active { transform: none } body { transition: none } }
</style>

<div class="wrap" id="app">
  <section class="view" id="view-today"></section>
  <section class="view" id="view-sick" hidden></section>
  <section class="view" id="view-growth" hidden></section>
  <section class="view" id="view-more" hidden></section>
</div>
<nav class="tabs"><div class="in" role="tablist">
  <button role="tab" data-tab="today" aria-selected="true">Today</button>
  <button role="tab" data-tab="growth" aria-selected="false">Growth</button>
  <button role="tab" data-tab="more" aria-selected="false">More</button>
</div></nav>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<button class="fab" id="fab" data-act="say" hidden aria-label="Say it: log anything by talking or typing"><svg viewBox="0 0 24 24" aria-hidden="true"></svg>Say it</button>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
'use strict';
const SDK_URL = 'https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.131.0/+esm';
const MODEL = 'claude-opus-5-5';
const LS_KEY = 'aura.v2', LS_OLD = 'sickdaylog.v1', DB_NAME = 'aura';
const DRIVE_FILE = 'aura-log.json', DRIVE_FOLDER = 'Aura';
// Aura's own Google project, filled in by build.sh from the repo's GOOGLE_CLIENT_ID and GOOGLE_PICKER_KEY variables.
// Both are public by design (Google restricts them to this site's address). A user's own values under More override them.
const built = v => /^__/.test(v) ? '' : v;
const GOOGLE_CLIENT_ID = built('__GOOGLE_CLIENT_ID__'), GOOGLE_PICKER_KEY = built('__GOOGLE_PICKER_KEY__');
const gClient = () => S.settings.clientId || GOOGLE_CLIENT_ID, gPickerKey = () => S.settings.pickerKey || GOOGLE_PICKER_KEY;
const FEVER_C = 38.0, EXAMPLE_V = 5;
const H = 3600e3, DAY = 24 * H;
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\/]/g, '\\$&');
// Symptoms are free text; preset tags found in the text are also kept as a list for reminders and the doctor summary.
const hasTag = (text, tag) => new RegExp('(^|[^a-z])' + reEsc(tag.toLowerCase()) + '($|[^a-z])').test(String(text || '').toLowerCase());
const tagsIn = text => SYMPTOMS.filter(t => hasTag(text, t));
function toggleTag(text, tag) {
  text = text || '';
  if (hasTag(text, tag)) {
    text = text.replace(new RegExp('[\\s,;]*' + reEsc(tag) + '(?![a-z])', 'i'), '').replace(/^[\s,;.]+/, '');
  } else {
    const base = text.replace(/[\s,;]+$/, '');
    text = base ? base + (/[.!?]$/.test(base) ? ' ' : ', ') + (/[.!?]$/.test(base) ? tag : tag.toLowerCase()) : tag;
  }
  return text.charAt(0).toUpperCase() + text.slice(1);
}
const BREAST = 'Breast', BOTTLE = 'Bottle or cup';

const MEAS = [['weightKg', 'Weight', 'kg', 0.01], ['heightCm', 'Height', 'cm', 0.1], ['headCm', 'Head', 'cm', 0.1]];

  const W = Math.max(300, Math.min(600, ($('#view-growth').clientWidth || 600) - 32)), Hh = 170, L = 44, R = 14, T = 12, B = 26;
  const xs = pts.map(p => p.t), ys = pts.map(p => p.v), t0 = Math.min(...xs), t1 = Math.max(...xs, t0 + DAY), span = Math.max(...ys) - Math.min(...ys) || 1;
  const lo = Math.min(...ys) - span * 0.15, hi = Math.max(...ys) + span * 0.15;
  const x = t => L + (t - t0) / (t1 - t0) * (W - L - R), y = v => T + (hi - v) / (hi - lo) * (Hh - T - B);
  let g = '';
  for (let i = 0; i <= 3; i++) { const v = lo + (hi - lo) * i / 3; g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${v.toFixed(1)}</text>`; }
  g += `<text x="${L}" y="${Hh - 6}" font-size="11" fill="var(--muted)">${fmtDay(t0)}</text><text x="${W - R}" y="${Hh - 6}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtDay(t1)}</text>`;
  g += `<polyline fill="none" stroke="var(--growth)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p => x(p.t) + ',' + y(p.v)).join(' ')}"/>`;
  g += pts.map((p, i) => `<circle cx="${x(p.t)}" cy="${y(p.v)}" r="${i === pts.length - 1 ? 5 : 3.5}" fill="var(--growth)"><title>${p.v} ${unit} · ${fmtDay(p.t)}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Chart in ${unit}" style="display:block;width:100%;height:auto">${g}</svg>`;
}

    case 'save-episode': {
      const start = new Date($('#f_start').value).getTime() || Date.now(), title = $('#f_title').value.trim();
      if (sheetCtx.ep) { const e = S.episodes.find(x => x.id === sheetCtx.ep); Object.assign(e, { title, start }); touch(e); closeSheet(); return commit(); }
      const e = touch({ id: uid(), childId: kid().id, title, start, end: null }); S.episodes.push(e);
      viewEpId = e.id; S.todayView = 'sick'; closeSheet(); tab = 'today'; commit(); return toast('Sick mode is on. Temperature and medicine are at the top.');
    }
    case 'del-episode': { const e = S.episodes.find(x => x.id === sheetCtx.ep); e.deleted = true; touch(e); closeSheet(); tab = 'today'; commit(); return toast('Illness deleted. Its entries stay in the daily log.'); }
    case 'end-ask': { const e = activeEp(); if (!e) return; viewEpId = e.id;
      return openSheet(`<div class="hd"><h2>End sick mode for ${esc(childOf(e)?.name || 'your child')}?</h2><button class="btn ghost" data-act="close" aria-label="Close">✕</button></div>
        <p class="muted" style="margin:0">Today goes back to everyday tracking. This illness and everything you logged stay saved under More → Illnesses, with its chart and doctor summary.</p>
        <div class="sheet-actions"><button class="btn ghost" data-act="close">Not yet</button><button class="btn primary" data-act="end-episode">Yes, end sick mode</button></div>`); }
    case 'end-episode': { const e = viewEp(); e.end = Date.now(); touch(e); closeSheet(); tab = 'today'; commit(); return toast('Glad to hear it. Sick mode is off.'); }
    case 'reopen-episode': { const e = viewEp(); e.end = null; touch(e); return commit(); }
    case 'clear-example': { const st = S.settings; S = emptyState(); S.settings = { ...S.settings, ...st }; narrative = ''; aiParsed = null; tab = 'today'; commit(); return kidSheet('new'); }
    case 'save-kid': {
      const name = $('#k_name').value.trim(); if (!name) return toast('Enter a name.');
      const c = sheetCtx.kid === 'new' ? { id: uid() } : S.children.find(k => k.id === sheetCtx.kid);
      Object.assign(c, { name, dob: $('#k_dob').value }); touch(c);
      const first = sheetCtx.kid === 'new' && !kids().length;
      if (sheetCtx.kid === 'new') { S.children.push(c); S.child = c.id; keepStorage(); } closeSheet(); commit(); if (first && !S.backedUpAt && !S.drive?.fileId) backupSheet(true); return;
    }
    case 'del-kid': { const c = S.children.find(k => k.id === sheetCtx.kid); c.deleted = true; touch(c); if (S.child === c.id) S.child = kids()[0]?.id || null; closeSheet(); return commit(); }
    case 'add-meas': return measSheet();
    case 'save-growth': {
      const ctx = sheetCtx.growth, label = $('#g_label')?.value.trim();
      if (ctx.kind === 'milestone' && !ctx.key && !label) return toast('Write what happened first.');
      const day = $('#g_date').value, t = day ? new Date(day + 'T12:00').getTime() : Date.now();
      const g = ctx.id ? S.growth.find(x => x.id === ctx.id) : { id: uid(), childId: kid().id, kind: ctx.kind, key: ctx.key };
      Object.assign(g, { t, note: $('#g_note').value.trim() }); if (label) g.label = label; touch(g);
      if (!ctx.id) S.growth.push(g); closeSheet(); commit(); return toast('Saved');
    }
    case 'del-growth': { const g = S.growth.find(x => x.id === sheetCtx.growth.id); g.deleted = true; touch(g); closeSheet(); commit(); return toast('Removed'); }
    case 'save-meas': {
      const vals = Object.fromEntries(MEAS.map(([k]) => { const v = $('#m_' + k).value; return [k, v === '' ? null : +v]; }));
      if (MEAS.every(([k]) => vals[k] == null)) return toast('Enter at least one measurement.');
      const day = $('#m_date').value, t = day ? new Date(day + 'T12:00').getTime() : Date.now();
      const m = sheetCtx.meas ? S.measurements.find(x => x.id === sheetCtx.meas) : { id: uid(), childId: sheetCtx.childId };
      Object.assign(m, vals, { t, note: $('#m_note').value.trim() }); touch(m);
      if (!sheetCtx.meas) S.measurements.push(m); closeSheet(); commit(); return toast('Measurement saved');
    }
    case 'del-meas': { const m = S.measurements.find(x => x.id === sheetCtx.meas); m.deleted = true; touch(m); closeSheet(); commit(); return toast('Deleted'); }
    case 'add-prod': { const n = $('#newProd').value.trim(); if (!n) return toast('Type a brand or product first.'); S.products.push(touch({ id: uid(), name: n })); commit();
      const hits = recallList().filter(r => recallMatch(r, [{ name: n }])).length; return toast(hits ? `${hits} recall${hits > 1 ? 's' : ''} in the list may match. See Today.` : 'Added. No recall in the list matches it now.'); }
    case 'recalls-more': recallsShown += 10; return sheetCtx?.feed ? recallFeedSheet() : renderMore();
    case 'recall-feed': recallsShown = 10; return recallFeedSheet();
    case 'recalls-check': return refreshRecalls(true);
    case 'add-med': { const n = $('#newMed').value.trim(); if (!n) return; S.meds.push(touch({ id: uid(), name: n, gapH: null })); return commit(); }
    case 'ai-parse': b.disabled = true; await aiParse(); b.disabled = false; return;
    case 'ai-add': { const keep = [...document.querySelectorAll('[data-pi]')].filter(x => x.checked).map(x => aiParsed[+x.dataset.pi]);
      keep.forEach(e => { e.child = kid().id; S.entries.push(touch(e)); }); aiParsed = null; closeSheet(); commit(); return toast(`Added ${keep.length} ${keep.length === 1 ? 'entry' : 'entries'}`); }
    case 'ai-discard': aiParsed = null; $('#aiOut').innerHTML = ''; return;
    case 'rec': return startRec(b);
    case 'say-note': { const text = $('#aiText').value.trim(); if (!text) return toast('Type or dictate what happened first.');
      S.entries.push(touch({ id: uid(), child: kid().id, type: 'note', t: Date.now(), note: text, ...(S.settings.me ? { by: S.settings.me } : {}) })); closeSheet(); commit(); return toast('Saved as a note'); }
    case 'ai-summary': return aiSummary();
    case 'copy-summary': { const ep = viewEp(); return copyText(summaryText(epEntries(ep), ep) + (narrative && narrative !== 'Writing…' ? '\n\nAI HANDOVER\n' + narrative : '')); }
    case 'export': return copyText(JSON.stringify(shareable()));
    case 'import': { const box = $('#importBox'); if (box.hidden) { box.hidden = false; box.focus(); return toast('Paste your data, then tap Restore again.'); }
      try { mergeIn(JSON.parse(box.value)); commit(); toast('Data restored'); }
      catch { toast("That doesn't look like Aura data."); } return; }
    case 'wipe': $('#wipeConfirm').innerHTML = `<div class="banner"><p>This deletes everything on this phone, including its daily copies. A copy in Google Drive is not deleted. Download a backup file first if you might want it back.</p><button class="btn danger sm" data-act="wipe-yes">Delete everything</button></div>`; return;
    case 'wipe-yes': allowShrink = true; try { localStorage.removeItem(LS_KEY); localStorage.removeItem(LS_OLD); } catch {} S = emptyState(); narrative = ''; tab = 'today'; commit(); if (db) dbKeys().then(ks => { const st = db.transaction('kv', 'readwrite').objectStore('kv'); ks.filter(k => String(k).startsWith('snap-')).forEach(k => st.delete(k)); }).catch(() => {}); return toast('Deleted from this device');
    case 'drive-sync': if ($('#clientId')) { S.settings.clientId = $('#clientId').value.trim(); persist(); } return sync(true);
    case 'drive-forget': S.drive = {}; gTok = null; backupsHome = null; return commit();
    case 'drive-backups': return driveBackupsSheet();
    case 'share': return share();
    case 'join': return joinSheet();
    case 'join-pick': return joinPick();
    case 'download': return saveBackupFile();
    case 'backup-now': return S.drive?.fileId ? sync(true) : backupSheet(false);
    case 'backup-snooze': S.backupSnooze = Date.now() + DAY; persist(); return render();
    case 'backup-file': closeSheet(); return saveBackupFile();
    case 'backup-drive': closeSheet(); if (gClient()) return sync(true); tab = 'more'; render(); $('#clientId')?.scrollIntoView({ block: 'center' }); return;
    case 'local-snaps': return localSnapsSheet();
    case 'restore-file': return $('#restoreFile').click();
  }
});
document.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.gap) { const m = S.meds.find(x => x.id === t.dataset.gap); m.gapH = t.value === '' ? null : +t.value; touch(m); persist(); scheduleSync(); }
  if (t.id === 'apiKey' || t.id === 'aiBase' || t.id === 'aiModel') { S.settings[t.id] = t.value.trim(); persist(); renderMore(); if (t.id === 'aiBase' && t.value && !okBase(t.value.trim())) toast('Use an https:// address, or http://localhost for a model on this computer.'); }
  if (t.id === 'clientId' || t.id === 'pickerKey') { S.settings[t.id] = t.value.trim(); persist(); }
  if (t.id === 'meName') { S.settings.me = t.value.trim(); persist(); }
  if (t.id === 'restoreFile' && t.files[0]) t.files[0].text().then(x => { mergeIn(JSON.parse(x)); commit(); toast('Backup restored'); }).catch(e => toast(e instanceof SyntaxError ? "That file isn't an Aura backup." : e.message));
});
function markTags() { const t = $('#f_symtext')?.value; document.querySelectorAll('#symTags [data-tag]').forEach(x => x.classList.toggle('on', hasTag(t, x.dataset.tag))); }
document.addEventListener('input', ev => { if (ev.target.id === 'f_symtext') markTags(); });
document.addEventListener('input', ev => { if (ev.target.matches('[data-custom]') && ev.target.value) ev.target.closest('.chips').querySelectorAll('button').forEach(x => x.classList.remove('on')); });
$('#scrim').addEventListener('click', ev => { if (ev.target.id === 'scrim') closeSheet(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape' && !$('#scrim').hidden) closeSheet(); });
document.addEventListener('visibilitychange', () => { if (S && !document.hidden && $('#scrim').hidden) { render(); scheduleSync(); refreshRecalls(); } });
if ('serviceWorker' in navigator && location.protocol === 'https:' && !window.claude) navigator.serviceWorker.register('sw.js').catch(() => {});
load().then(() => {
  $('#fab svg').innerHTML = ICONS.say;
  render();
  if (!S.example) { keepStorage(); localSnapshot(); }
  refreshRecalls();
  setInterval(tickTimers, 1000);
  setInterval(() => { if (!document.hidden && $('#scrim').hidden && tab !== 'more') render(); else applyTheme(); }, 60e3);
  // Pick up a partner's entries while the app is open.
  setInterval(() => { if (!document.hidden && gTok && gTok.exp > Date.now() + 60e3) sync(false); }, 5 * 60e3);
  scheduleSync();
});
})();
</script>
